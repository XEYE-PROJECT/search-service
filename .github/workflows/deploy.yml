name: CI/CD

# Push a master: checks (checks.yml: gitleaks, ruff + mypy, pytest) → imagen (etiquetada con el
# SHA) → escaneo Trivy → despliegue
# a staging (si está habilitado) → despliegue a producción (entorno `production`: con "required
# reviewers" configurados en Settings → Environments, el job espera aprobación manual).
# Ejecución manual (workflow_dispatch): vuelve a desplegar un SHA ya publicado en GHCR en el
# entorno elegido, sin reconstruir nada — es el rollback desde GitHub
# (`deploy.sh` en el servidor hace lo mismo por SSH).
#
# Flujo completo del repo: PR → checks (ci.yml); push a master → checks + imagen :sha + despliegue
# (este fichero); tag vX.Y.Z → imagen :vX.Y.Z + release con notas del CHANGELOG (release.yml).
#
# Todas las actions van fijadas por SHA de commit (el tag es solo un comentario); Dependabot las
# actualiza. Las imágenes de herramientas van por digest.
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      sha:
        description: 'SHA completo ya publicado en GHCR (vacío = el commit actual de master)'
        required: false
        default: ''
      target:
        description: 'Entorno'
        type: choice
        options: [production, staging]
        default: production

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/xeye-project/search-service

jobs:
  # gitleaks + ruff/mypy + pytest, compartidos con ci.yml (PR) y release.yml (tags).
  checks:
    if: github.event_name == 'push'
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read

  build-push:
    if: github.event_name == 'push'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          # Sin override de EXTRA_EMBEDDING_MODELS: aplica el default del Dockerfile,
          # que hornea mpnet además de MiniLM (prod ofrece ambos desde 2026-08-06).
          build-args: |
            GIT_SHA=${{ github.sha }}
          # :latest solo como valor por defecto del compose en un servidor recién instalado;
          # deploy.sh siempre despliega por SHA.
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Escaneo de la imagen publicada: una vulnerabilidad CRÍTICA con arreglo disponible bloquea el
  # despliegue; el informe completo (HIGH incluido) va a Security → Code scanning.
  scan:
    if: github.event_name == 'push'
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Trivy (informe SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always()
        with:
          sarif_file: trivy.sarif
      - name: Trivy (bloqueo por CRITICAL con arreglo)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          skip-setup-trivy: true

  # Staging: mismo compose y mismos scripts en otro servidor (secretos SSH_* del entorno
  # `staging`). Se activa con la variable de repositorio STAGING_ENABLED=true.
  deploy-staging:
    if: github.event_name == 'push' && vars.STAGING_ENABLED == 'true'
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://search-staging.xeye.es
    steps:
      - uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: /opt/xeye-infra/deploy.sh search-service ${{ github.sha }}

  deploy-production:
    if: github.event_name == 'push' && !cancelled() && needs.scan.result == 'success' && (needs.deploy-staging.result == 'success' || needs.deploy-staging.result == 'skipped')
    needs: [scan, deploy-staging]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://search.xeye.es
    steps:
      - uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          # Despliega el commit exacto (no :latest) y falla si el contenedor no llega a healthy.
          script: /opt/xeye-infra/deploy.sh search-service ${{ github.sha }}

  # Rollback / redespliegue manual de un SHA ya publicado (Actions → CI/CD → Run workflow).
  redeploy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.target }}
    steps:
      - name: Validar el SHA
        run: |
          sha='${{ inputs.sha || github.sha }}'
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::SHA no válido: $sha"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_ENV"
      - uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: /opt/xeye-infra/deploy.sh search-service ${{ env.sha }}
