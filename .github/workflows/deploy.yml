name: CI/CD

# Push a master: gitleaks + pytest → imagen (etiquetada con el SHA) → escaneo Trivy → despliegue
# a staging (si está habilitado) → despliegue a producción (entorno `production`: con "required
# reviewers" configurados en Settings → Environments, el job espera aprobación manual).
# Ejecución manual (workflow_dispatch): vuelve a desplegar un SHA ya publicado en GHCR en el
# entorno elegido, sin reconstruir nada — es el rollback desde GitHub
# (`deploy.sh` en el servidor hace lo mismo por SSH).
#
# Todas las actions van fijadas por SHA de commit (el tag es solo un comentario); Dependabot las
# actualiza. Las imágenes de herramientas van por digest.
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      sha:
        description: 'SHA completo ya publicado en GHCR (vacío = el commit actual de master)'
        required: false
        default: ''
      target:
        description: 'Entorno'
        type: choice
        options: [production, staging]
        default: production

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/xeye-project/search-service

jobs:
  # Ningún secreto llega al historial: gitleaks sobre todo el repo (binario oficial vía docker;
  # la action de gitleaks exige licencia en organizaciones, el binario no).
  secrets:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: gitleaks
        run: >
          docker run --rm -v "$PWD:/repo"
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --redact -v --exit-code 1

  test:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install (torch CPU, como en el Dockerfile)
        run: |
          pip install --quiet "$(grep -i '^torch==' requirements.lock)" --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet -r requirements-dev.txt
      # Si falla, la cola del log sale como anotación del check (visible sin permisos de admin).
      - name: pytest
        run: |
          set -o pipefail
          pytest -q -x -p no:cacheprovider 2>&1 | tee pytest.log || {
            printf '::error title=pytest::%s\n' "$(tail -c 3500 pytest.log | tr '\n' '\r' | sed 's/\r/%0A/g')"
            exit 1
          }

  build-push:
    if: github.event_name == 'push'
    needs: [secrets, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          # Sin override de EXTRA_EMBEDDING_MODELS: aplica el default del Dockerfile,
          # que hornea mpnet además de MiniLM (prod ofrece ambos desde 2026-08-06).
          build-args: |
            GIT_SHA=${{ github.sha }}
          # :latest solo como valor por defecto del compose en un servidor recién instalado;
          # deploy.sh siempre despliega por SHA.
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Escaneo de la imagen publicada: una vulnerabilidad CRÍTICA con arreglo disponible bloquea el
  # despliegue; el informe completo (HIGH incluido) va a Security → Code scanning.
  scan:
    if: github.event_name == 'push'
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Trivy (informe SARIF)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always()
        with:
          sarif_file: trivy.sarif
      - name: Trivy (bloqueo por CRITICAL con arreglo)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          skip-setup-trivy: true

  # Staging: mismo compose y mismos scripts en otro servidor (secretos SSH_* del entorno
  # `staging`). Se activa con la variable de repositorio STAGING_ENABLED=true.
  deploy-staging:
    if: github.event_name == 'push' && vars.STAGING_ENABLED == 'true'
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://search-staging.xeye.es
    steps:
      - uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: /opt/xeye-infra/deploy.sh search-service ${{ github.sha }}

  deploy-production:
    if: github.event_name == 'push' && !cancelled() && needs.scan.result == 'success' && (needs.deploy-staging.result == 'success' || needs.deploy-staging.result == 'skipped')
    needs: [scan, deploy-staging]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://search.xeye.es
    steps:
      - uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          # Despliega el commit exacto (no :latest) y falla si el contenedor no llega a healthy.
          script: /opt/xeye-infra/deploy.sh search-service ${{ github.sha }}

  # Rollback / redespliegue manual de un SHA ya publicado (Actions → CI/CD → Run workflow).
  redeploy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.target }}
    steps:
      - name: Validar el SHA
        run: |
          sha='${{ inputs.sha || github.sha }}'
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::SHA no válido: $sha"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_ENV"
      - uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: /opt/xeye-infra/deploy.sh search-service ${{ env.sha }}
