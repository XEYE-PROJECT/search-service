name: Release

# Tag vX.Y.Z (lo crea `bash release.sh X.Y.Z`): checks (gitleaks, ruff + mypy, pytest) →
# imagen en GHCR etiquetada :vX.Y.Z y :sha → GitHub Release con la sección de esa versión del
# CHANGELOG.md como notas. El despliegue a producción sigue siendo el de deploy.yml (push a
# master, por SHA); la imagen :vX.Y.Z es la referencia estable de cada versión publicada.
#
# Todas las actions van fijadas por SHA de commit (el tag es solo un comentario); Dependabot las
# actualiza.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

env:
  IMAGE: ghcr.io/xeye-project/search-service

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read

  image:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validar el tag y extraer las notas del CHANGELOG
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::El tag debe ser vX.Y.Z (recibido: $GITHUB_REF_NAME)"; exit 1; }
          [[ -f CHANGELOG.md ]] || { echo "::error::Falta CHANGELOG.md"; exit 1; }
          # Sección "## [X.Y.Z]" del CHANGELOG (hasta el siguiente "## [").
          awk -v v="${GITHUB_REF_NAME#v}" '/^## \[/{p = index($0, "[" v "]") > 0} p' CHANGELOG.md > notes.md
          [[ -s notes.md ]] || {
            echo "::error::CHANGELOG.md no tiene la sección [${GITHUB_REF_NAME#v}]"; exit 1; }
          cat notes.md
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ github.ref_name }}
          body_path: notes.md
